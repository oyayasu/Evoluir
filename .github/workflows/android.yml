name: Android debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Restore and publish Kotlin source
        shell: bash
        run: |
          if [ -f .bootstrap/evoluir-source.tar.xz ]; then
            echo "f91b3c65f3f0917c4bcdfb65e1213bd04da309016a8b249b07b4e348f5d9350d  .bootstrap/evoluir-source.tar.xz" | sha256sum -c
            tar -xJf .bootstrap/evoluir-source.tar.xz --exclude='./.github'
            git rm -f .bootstrap/evoluir-source.tar.xz
            git add -A
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add Evoluir Android source code'
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish APK for download
        uses: actions/upload-artifact@v4
        with:
          name: evoluir-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
